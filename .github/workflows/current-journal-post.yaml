---
name: Latest Personal Journal Links
on:
  schedule:              # Run workflow automatically
    - cron: '0 5 * * *'  # at 05:00:00 ever day
  workflow_dispatch:     # Run manually via GitHub Actions Workflow page

jobs:
  update-readme-with-blog:
    name: Update Journal Links
    runs-on: ubuntu-slim
    steps:
      - run: echo "🚀 Job automatically triggered by ${{ github.event_name }}"
      - run: echo "🐧 Job running on ${{ runner.os }} server"
      - run: echo "🐙 Using ${{ github.ref }} branch from ${{ github.repository }} repository"

      - uses: actions/checkout@v7
      - run: echo "🐙 ${{ github.repository }} repository checkout to the CI runner, default depth=1"

      - name: Get RSS Feed
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "PRACTICALLI_JOURNAL"
          commit_message: "docs(readme): 🔗 update practicalli journal post links"
          feed_list: "https://practical.li/journal/feed_rss_created.xml"
          max_post_count: 4

      # Summary
      - run: echo "🍏 Job status is ${{ job.status }}."
