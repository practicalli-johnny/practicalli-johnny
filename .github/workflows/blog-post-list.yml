---
name: Latest blog post workflow
on:
  schedule:              # Run workflow automatically
    - cron: '0 4 * * *'  # at 04:00:00 ever day
  workflow_dispatch:     # Run manually via GitHub Actions Workflow page

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get RSS Feed
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          commit_message: "docs(readme): 🔗 update practicalli blog post links"
          feed_list: "https://practical.li/feed_rss_created.xml"
          max_post_count: 7
